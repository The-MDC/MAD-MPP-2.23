[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.24"
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# PLACEHOLDER — real endpoints required before deployment (see docs/BACKEND_PLACEHOLDERS.md)
arbitrum_one = "${ARBITRUM_ONE_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_one = { key = "${ARBISCAN_API_KEY}" }

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 32
