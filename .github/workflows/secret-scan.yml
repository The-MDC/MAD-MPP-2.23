name: Secret Scan

# Blocks PRs that introduce hardcoded secrets — the rule mandated by
# .claude/rules/common-security.md ("NEVER hardcode secrets") that previously
# had no enforcing gate. TruffleHog is used (not gitleaks-action) because it is
# free for every repo type with no org licence key, and it scans the PR diff by
# default so it flags only NEWLY introduced secrets, not the whole history.
#
# PR-scoped by design: new secrets almost always arrive via a PR, and direct
# pushes to main are meant to be closed off by branch protection. --only-verified
# keeps the signal low-noise (fails on secrets TruffleHog can validate as live).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan PR diff for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          # --exclude-detectors=lob — a detector collision, not a suppressed finding.
          #
          # Lob (a direct-mail API this project does not use and has no dependency
          # on) keys look like `(live|test)_[a-zA-Z0-9]{35}`. Foundry's test naming
          # convention produces exactly that shape:
          #
          #     function test_DestroyedSubjectCanNeverBeReRegistered() public
          #                  └─ `test_` + 38 alphanumerics ─┘
          #
          # Five such function names across contracts/test/**, plus vendored
          # forge-std, were reported as VERIFIED secrets on the restore PR — the
          # first scan ever to cover those files, because they had been on main
          # since before this gate existed and so never appeared in a PR diff.
          #
          # Every other detector stays live, including the ones that matter here:
          # AWS, GitHub, Google, Postgres/Neon URLs and private keys. Renaming real
          # test functions to appease a regex for an unused vendor would be the
          # wrong repair — the code is correct and the detector does not apply.
          extra_args: --only-verified --exclude-detectors=lob
