name: Secret Scan

# Blocks PRs that introduce hardcoded secrets — the rule mandated by
# .claude/rules/common-security.md ("NEVER hardcode secrets") that previously
# had no enforcing gate. TruffleHog is used (not gitleaks-action) because it is
# free for every repo type with no org licence key, and it scans the PR diff by
# default so it flags only NEWLY introduced secrets, not the whole history.
#
# PR-scoped by design: new secrets almost always arrive via a PR, and direct
# pushes to main are meant to be closed off by branch protection. --only-verified
# keeps the signal low-noise (fails on secrets TruffleHog can validate as live).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR diff for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
