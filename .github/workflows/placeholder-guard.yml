name: Placeholder Guard

# Fails the build if any source file is a prose placeholder instead of real code.
# This is the tripwire for the failure mode that overwrote main with one-line
# descriptions (e.g. "file_content from types.ts", "Full MADStaking with rewards").

on:
  push:
    branches: [main, "mad-mpp-2.24"]
  pull_request:

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan for placeholder source files
        run: |
          set -euo pipefail
          fail=0

          # Pathspecs below are DELIBERATELY `dir/*.ext`, not `dir/**/*.ext`.
          #
          # A git pathspec is not a shell glob. Without :(glob) magic, `*`
          # already crosses `/`, so `verify/*.ts` matches every depth — while
          # `**` is NOT special and matches a literal path component, so
          # `contracts/src/**/*.sol` requires an intervening directory that
          # does not exist. Result, until 2026-08-18:
          #
          #   git ls-files 'contracts/src/**/*.sol'  -> 0 files   (should be 10)
          #   git ls-files 'contracts/test/**/*.sol' -> 0 files   (should be  9)
          #   git ls-files 'verify/**/*.ts'          -> 203 files (should be 206)
          #
          # So the pragma check had never scanned a single contract, and the
          # code-token check silently skipped exactly the files sitting at the
          # top of verify/ — including proxy.ts, the SIWE gate. The guard
          # reported success by scanning nothing. Both are fixed here; all 19
          # contracts and all 206 TS/TSX files pass on the tree as of this
          # commit, so this turns coverage on without changing the verdict.
          #
          # If you reintroduce `**`, prefix the pathspec with `:(glob)`.

          # 1) TS/TSX under verify/ must contain real code tokens.
          while IFS= read -r f; do
            case "$f" in *next-env.d.ts) continue;; esac
            if ! grep -qE '(import |export |function |=>|;|\{)' "$f"; then
              echo "::error file=$f::TS/TSX file has no code tokens (placeholder?)"
              fail=1
            fi
          done < <(git ls-files 'verify/*.ts' 'verify/*.tsx')

          # 2) Solidity under contracts/src and contracts/test must have a pragma.
          while IFS= read -r f; do
            if ! grep -qE 'pragma solidity' "$f"; then
              echo "::error file=$f::Solidity file missing pragma (placeholder?)"
              fail=1
            fi
          done < <(git ls-files 'contracts/src/*.sol' 'contracts/test/*.sol')

          # 3) Known placeholder phrases anywhere in tracked source.
          if git grep -nIE 'file_content from|The content of [a-z_]+\.ts|Full [A-Za-z]+ with rewards|Minimal core staking|Orchestrator layer' -- \
               'verify/**' 'contracts/src/**' 'contracts/test/**' ; then
            echo "::error::Placeholder phrase found in tracked source"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Placeholder guard FAILED — real code required, not descriptions."
            exit 1
          fi
          echo "Placeholder guard passed ✓"
