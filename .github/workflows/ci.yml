name: CI

on:
  # Dispatchable on purpose. The 2026-08-16 → 08-24 Actions outage let three PRs
  # merge ungated, and afterwards there was no way to answer "is main actually
  # green?" — every trigger here is push/PR, so `main`'s tip could only be gated
  # by pushing to it again. `workflow_dispatch` makes the question answerable
  # without inventing a commit. Same reasoning as placeholder-guard.yml, which
  # gained it for exactly this in 8324cf6.
  workflow_dispatch:
  pull_request:
    paths:
      - "verify/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [ main ]
    paths:
      - "verify/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── One job, deliberately ───────────────────────────────────────────────
# This was four parallel jobs (type-check / lint / route-guards / build).
# Three of them each ran their own checkout + setup-node + `npm ci`, so a
# single push paid the install cost of ~650 packages THREE times while the
# checks themselves take seconds. On a minutes-metered private repo the
# install, not the checking, was the bill.
#
# Collapsed to one job with one install. Ordering is chosen so the cheapest
# thing that can fail runs first:
#
#   route-guard  — dependency-free (scripts/check-route-guards.mjs), so it
#                  runs BEFORE npm ci and fails in seconds, not minutes
#   npm ci       — the one install
#   type-check   — cheapest of the three node checks
#   lint         — report-only, must not fail the job (see below)
#   build        — most expensive, so last
#
# TRADE-OFF, accepted knowingly: these no longer report as four independent
# checks, and a type-check failure now short-circuits before build, so one
# run surfaces one failure rather than all of them. That is the intended
# exchange — fewer minutes for slightly coarser reporting. If Actions minutes
# stop being the constraint, splitting back out is a clean revert.
#
# ⚠️ If branch protection requires the OLD check names ("Type-check (verify/)",
# "Lint (eslint)", "Build (next build)", "Route-guard check"), those names no
# longer exist and required-checks must be repointed at "Verify" or merges
# will block forever waiting on checks that can never report.

# Least privilege. Without this block a workflow inherits the REPOSITORY
# default token scope, which on older repos is read-write across the API — an
# action compromise then reaches far past the job that ran it. The four
# workflows that already declared this were fine; these did not.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify
    steps:
      # actions/checkout is held at v4 across every workflow in this repo —
      # v6.1.0 moved the floating `v6` tag onto a breaking pull_request_target
      # change on 2026-06-18. Rationale and the Dependabot ignore that keeps it
      # here live in .github/dependabot.yml. Do not bump this in isolation.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verify/package-lock.json

      # ── Route-guard gate (pre-install, dependency-free) ──────────────
      # Fails if a mutating route handler (POST/PUT/PATCH/DELETE) has no
      # recognizable auth/rate-limit guard and no explicit `// PUBLIC-ROUTE:`
      # opt-out. An audit found 33 of 53 mutating routes unprotected — not by
      # decision, just because nobody remembered. This keeps that visible on
      # every PR instead of only in a manual audit.
      - name: Route-guard check
        run: node scripts/check-route-guards.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run type-check

      # ── Lint gate (report-only) ──────────────────────────────────────
      # ESLint (next/core-web-vitals) — catches react-hooks/rules-of-hooks and
      # @next/next correctness rules that had no gate before. Invokes eslint
      # directly: Next 16 REMOVED the `next lint` subcommand.
      #
      # Staged report-only via continue-on-error because eslint-config-next is
      # still pinned to 15.4.5 against Next 16, and the npm registry is blocked
      # in-sandbox so the lockfile can't be regenerated to realign it and move
      # to flat config. Once that lands, drop continue-on-error to enforce.
      #
      # NOTE: as a STEP-level continue-on-error this keeps its old semantics —
      # lint failures are reported but do not fail the job, and the build step
      # below still runs.
      - name: Lint (eslint)
        continue-on-error: true
        run: npm run lint

      # ── Build gate ───────────────────────────────────────────────────
      # The real `next build` on every PR, so prerender/build breaks block the
      # PR rather than surfacing after merge. No app env vars are set; missing
      # NEXT_PUBLIC_* just inline as undefined at build (non-fatal).
      - name: Build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # `npm run build` runs scripts/migrate.mjs first and hard-fails
          # without a DATABASE_URL. CI has no database — skip loudly here;
          # real migrations are enforced on Vercel builds, which do have one.
          SKIP_MIGRATIONS: "1"
