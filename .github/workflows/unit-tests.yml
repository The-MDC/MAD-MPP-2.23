name: Unit Tests

on:
  # See ci.yml — dispatchable so this gate can be run against `main` on demand
  # rather than only as a side effect of a push.
  workflow_dispatch:
  pull_request:
    paths:
      - "verify/**"
      - ".github/workflows/unit-tests.yml"
  push:
    branches: [ main ]
    paths:
      - "verify/**"
      - ".github/workflows/unit-tests.yml"

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true


# Least privilege. Without this block a workflow inherits the REPOSITORY
# default token scope, which on older repos is read-write across the API — an
# action compromise then reaches far past the job that ran it. The four
# workflows that already declared this were fine; these did not.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: verify/package-lock.json
      # vitest comes from the lockfile like every other dependency. This job used to run
      # `npm install --no-save vitest@^3.2.4` after `npm ci`, a leftover from when vitest was not in
      # package.json. package.json now locks vitest ^5, so that step silently DOWNGRADED the test
      # runner in CI to 3.x while every developer ran 5.x: the suite CI passed was not the suite
      # people ran. scripts/check-gates.mjs fails if a workflow installs over the locked tree again.
      - name: Install app dependencies (locked)
        run: npm ci
      - name: Run unit tests
        run: npx vitest run
