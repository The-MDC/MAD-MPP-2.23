name: Create/Delete Branch for Pull Request
# Diet (Aug 2026): dropped `synchronize` — the Neon branch is created once per
# PR and deleted on close; re-creating it on every commit burned 3+ jobs per
# push while Vercel PR previews are dashboard-Ignored (nothing consumes the
# per-commit branch). Re-add `synchronize` if per-commit DB previews return.
on:
  pull_request:
    types:
      - opened
      - reopened
      - closed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8
  create_neon_branch:
    name: Create Neon Branch
    outputs:
      db_url: ${{ steps.create_neon_branch_encode.outputs.db_url }}
      db_url_with_pooler: ${{ steps.create_neon_branch_encode.outputs.db_url_with_pooler }}
    needs: setup
    # Guarded on the Neon secret so a missing/rotated key skips gracefully
    # instead of failing the PR red (same posture as db-migrate.yml).
    if: |
      github.event_name == 'pull_request'
      && (github.event.action == 'opened' || github.event.action == 'reopened')
      && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # ── Prove the DB is real: apply the schema to the fresh branch and
      #    write+read every core table. A green here means the backend's live
      #    Postgres path works — not just the degrade-to-demo fallback.
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps (verify/)
        working-directory: verify
        run: npm ci
      - name: Apply migrations to the Neon branch
        working-directory: verify
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: npm run migrate
      - name: Live DB smoke (write+read every table, rolled back)
        working-directory: verify
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: npm run db:smoke
  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}