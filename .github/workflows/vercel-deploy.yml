name: Vercel Production Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix verify
      - run: npm run build --prefix verify
      # Vercel's native Git integration already deploys `main`, so this
      # Action-based deploy is optional. It runs ONLY when VERCEL_TOKEN is
      # configured — otherwise the job stays green (build-verified) instead of
      # failing on a missing secret. `--prod` replaces the invalid `production`
      # input that amondnet/vercel-action@v25 does not accept.
      - name: Deploy to Vercel (only when token is configured)
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./verify
          scope: madgambit
          vercel-args: '--prod'
